name: Production Release - Aurora Alarme

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze & Test
        run: |
          flutter analyze
          flutter test

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Android Artifacts
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # App Bundle (para Google Play)
          flutter build appbundle --release

          # APKs separados por arquitetura (mais leves)
          flutter build apk --release --split-per-abi

          # APK universal (opcional, mas útil)
          flutter build apk --release

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}

          # App Bundle
          cp build/app/outputs/bundle/release/app-release.aab \
             release-assets/aurora-alarm-${VERSION}.aab

          # APKs por arquitetura
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             release-assets/aurora-alarm-${VERSION}-arm64-v8a.apk

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             release-assets/aurora-alarm-${VERSION}-armeabi-v7a.apk

          # APK universal
          cp build/app/outputs/flutter-apk/app-release.apk \
             release-assets/aurora-alarm-${VERSION}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aurora Alarme ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
